<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play drunkenmaster</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1><a href="#/">drunkenmaster</a></h1>
  <nav>
    <a href="#/" data-nav="play">Play</a>
    <a href="#/players" data-nav="players">Players</a>
  </nav>
</header>

<main>
  <!-- Start a game -->
  <section id="view-setup" class="view">
    <h2>New game</h2>
    <form id="setup">
      <label>Your name
        <input id="name" name="name" maxlength="40" required autocomplete="nickname"
               placeholder="e.g. adarsh">
      </label>
      <label>Time control
        <select id="time-control">
          <option value="60+0">1 min</option>
          <option value="180+0">3 min</option>
          <option value="180+2">3 min + 2s</option>
          <option value="300+0" selected>5 min</option>
          <option value="600+0">10 min</option>
          <option value="900+10">15 min + 10s</option>
        </select>
      </label>
      <label>You play
        <select id="colour">
          <option value="white" selected>White</option>
          <option value="black">Black</option>
          <option value="random">Random</option>
        </select>
      </label>
      <button type="submit">Start</button>
    </form>
    <p class="note" id="storage-note"></p>
  </section>

  <!-- The game -->
  <section id="view-game" class="view" hidden>
    <div class="game">
      <div class="board-side">
        <div class="clock" id="clock-top"><span class="who"></span><span class="time"></span></div>
        <div id="board" class="board" role="grid" aria-label="chess board"></div>
        <div class="clock" id="clock-bottom"><span class="who"></span><span class="time"></span></div>
      </div>
      <aside class="panel">
        <p class="status" id="status">Your move.</p>
        <ol id="moves" class="moves"></ol>
        <div class="actions">
          <button id="resign" type="button">Resign</button>
          <button id="again" type="button" hidden>New game</button>
        </div>
        <p class="note" id="engine-note"></p>
      </aside>
    </div>
  </section>

  <!-- Player folders -->
  <section id="view-players" class="view" hidden>
    <h2>Players</h2>
    <p class="note">Every game anyone has played is filed under their name.</p>
    <div id="player-list" class="cards"></div>
  </section>

  <section id="view-player" class="view" hidden>
    <h2 id="player-title"></h2>
    <p class="note" id="player-summary"></p>
    <div id="player-games" class="cards"></div>
  </section>
</main>

<footer>
  <p>The engine is the same <code>agent.py</code> entered in the AI Chessathon. It thinks for about
     four seconds a move here, less than the two minutes a side it gets in rated play.</p>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
